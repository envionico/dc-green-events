  transition: border-color 0.16s, box-shadow 0.16s, transform 0.16s;
}
.event-card:hover {
  border-color: #d8d7d1;
  box-shadow: var(--shadow);
  transform: translateY(-2px);
}
.event-card:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* date chip on the left */
.date-chip {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 3px;
}
.date-chip .mon {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--brand);
}
.date-chip .day {
  font-size: 1.85rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.05;
  color: var(--text);
}
.date-chip .dow {
  font-size: 0.68rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-3);
  margin-top: 1px;
}

.card-main { min-width: 0; }

.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
}
.event-card h2 {
  font-size: 1.16rem;
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 1.3;
  color: var(--text);
}
.event-org {
  margin-top: 4px;
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--text-2);
}

/* type tag with a leading dot */
.tag {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.73rem;
  font-weight: 600;
  padding: 4px 10px 4px 8px;
  border-radius: 999px;
}
.tag .dot { width: 7px; height: 7px; border-radius: 50%; }
.tag-tree{background:var(--t-tree-bg);color:var(--t-tree-fg);} .tag-tree .dot{background:var(--t-tree);}
.tag-river{background:var(--t-river-bg);color:var(--t-river-fg);} .tag-river .dot{background:var(--t-river);}
.tag-park{background:var(--t-park-bg);color:var(--t-park-fg);} .tag-park .dot{background:var(--t-park);}
.tag-advocacy{background:var(--t-adv-bg);color:var(--t-adv-fg);} .tag-advocacy .dot{background:var(--t-adv);}
.tag-education{background:var(--t-edu-bg);color:var(--t-edu-fg);} .tag-education .dot{background:var(--t-edu);}
.tag-other{background:var(--t-other-bg);color:var(--t-other-fg);} .tag-other .dot{background:var(--t-other);}

.event-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 16px;
  margin: 13px 0;
  font-size: 0.89rem;
  color: var(--text-2);
}
.meta-item { display: inline-flex; align-items: center; gap: 6px; }
.meta-item svg { width: 15px; height: 15px; color: var(--text-3); flex-shrink: 0; }

.event-desc {
  font-size: 0.94rem;
  line-height: 1.55;
  color: var(--text-2);
  margin-bottom: 16px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-cta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--brand);
}
.card-cta svg { width: 15px; height: 15px; transition: transform 0.16s; }
.event-card:hover .card-cta svg { transform: translateX(3px); }

/* ============================================================
   Empty state
   ============================================================ */
.empty-state {
  text-align: center;
  padding: 60px 24px;
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: var(--r);
}
.empty-state svg { width: 34px; height: 34px; color: var(--text-3); margin-bottom: 12px; }
.empty-state strong {
  display: block;
  font-size: 1.06rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 5px;
}
.empty-state span { font-size: 0.93rem; color: var(--text-2); }
.empty-reset {
  margin-top: 16px;
  font-family: var(--sans);
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--brand);
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* ============================================================
   Map view
   ============================================================ */
.map-wrap {
  position: relative;
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.map-canvas {
  width: 100%;
  height: 540px;
  background: var(--surface-2);
  z-index: 1;
}
@media (max-width: 560px) {
  .map-canvas { height: 440px; }
}
.map-empty {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(251, 251, 250, 0.85);
  color: var(--text-2);
  font-size: 0.95rem;
  z-index: 500;
}

/* Custom teardrop pins (Leaflet divIcon) */
.map-pin {
  width: 26px;
  height: 26px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  border: 2.5px solid #fff;
  box-shadow: 0 2px 5px rgba(0,0,0,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
}
/* the count number is counter-rotated so it stays upright */
.map-pin-num {
  transform: rotate(45deg);
  color: #fff;
  font-size: 0.74rem;
  font-weight: 800;
  font-family: var(--sans);
}

/* Leaflet popup restyled to match the app */
.leaflet-popup-content-wrapper {
  border-radius: 12px !important;
  box-shadow: 0 8px 28px rgba(20,30,25,0.18) !important;
  padding: 0 !important;
}
.leaflet-popup-content { margin: 0 !important; }
.map-popup { padding: 14px 15px 12px; font-family: var(--sans); }
.map-popup-venue { font-size: 0.95rem; font-weight: 700; color: var(--text); }
.map-popup-addr { font-size: 0.8rem; color: var(--text-3); margin-top: 2px; line-height: 1.4; }
.map-popup-list { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.map-popup-event {
  display: flex;
  align-items: baseline;
  gap: 9px;
  width: 100%;
  text-align: left;
  padding: 7px 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.14s, border-color 0.14s;
  font-family: var(--sans);
}
.map-popup-event:hover { background: #eef4f0; border-color: #cfe0d6; }
.mpe-date { font-size: 0.72rem; font-weight: 800; white-space: nowrap; letter-spacing: 0.02em; }
.mpe-title { font-size: 0.84rem; font-weight: 600; color: var(--text); line-height: 1.3; }
.leaflet-container a.leaflet-popup-close-button { color: var(--text-3) !important; }

/* Map legend (event-type colors) */
.map-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  margin-top: 12px;
  padding: 0 2px;
}
.map-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  color: var(--text-2);
}
.map-legend-dot { width: 10px; height: 10px; border-radius: 50%; }

/* ============================================================
   Calendar view
   ============================================================ */
.calendar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 20px;
  box-shadow: var(--shadow-sm);
}
.cal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.cal-head h2 {
  font-size: 1.3rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text);
}
.cal-head h2 .cal-year { color: var(--text-3); font-weight: 500; }
.cal-nav { display: flex; gap: 7px; }
.cal-nav button {
  width: 38px; height: 38px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-2);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: all 0.15s;
}
.cal-nav button:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-tint); }
.cal-nav button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.cal-nav button svg { width: 16px; height: 16px; }
/* the "Today" pill is text, not a square icon button */
.cal-nav button.cal-today {
  width: auto;
  padding: 0 15px;
  font-family: var(--sans);
  font-size: 0.84rem;
  font-weight: 600;
}

.cal-weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 6px; margin-bottom: 6px;
}
.cal-weekday {
  text-align: center;
  font-size: 0.68rem; font-weight: 700;
  letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--text-3);
  padding: 4px 0;
}
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-cell {
  min-height: 92px;
  border: 1px solid var(--border-2);
  border-radius: var(--r-sm);
  padding: 6px;
  background: var(--bg);
  display: flex; flex-direction: column; gap: 4px;
  overflow: hidden;
}
.cal-cell.empty { background: transparent; border-color: transparent; }
.cal-cell.today { border-color: var(--brand); background: var(--brand-tint); }
.cal-daynum { font-size: 0.74rem; font-weight: 700; color: var(--text-2); }
.cal-cell.today .cal-daynum { color: var(--brand); }
.cal-events-wrap { display: flex; flex-direction: column; gap: 3px; }
.cal-event {
  font-family: var(--sans);
  font-size: 0.7rem; font-weight: 600;
  line-height: 1.25; text-align: left;
  padding: 3px 7px; border-radius: 5px; border: none;
  color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: pointer; width: 100%;
  transition: filter 0.14s;
}
.cal-event:hover { filter: brightness(1.08); }
.cal-event:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }

.cal-detail { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }
.cal-detail-head {
  font-size: 0.8rem; font-weight: 700;
  color: var(--text-2); margin-bottom: 12px;
}
.cal-detail-empty {
  text-align: center; font-size: 0.9rem;
  color: var(--text-3); padding: 6px 0 2px;
}

/* ============================================================
   Modal (event detail + sign-up)
   ============================================================ */
.modal-overlay {
  position: fixed; inset: 0;
  z-index: 100;
  background: rgba(18, 26, 22, 0.5);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 0;
  animation: fade 0.2s ease;
}
@media (min-width: 620px) {
  .modal-overlay { align-items: center; padding: 24px; }
}

.modal {
  position: relative;
  width: 100%;
  max-width: 480px;
  max-height: 92vh;
  overflow-y: auto;
  background: var(--surface);
  border-radius: 18px 18px 0 0;
  box-shadow: var(--shadow-lg);
  animation: sheet 0.26s cubic-bezier(0.22, 1, 0.36, 1);
}
@media (min-width: 620px) {
  .modal { border-radius: 18px; animation: pop 0.24s cubic-bezier(0.22, 1, 0.36, 1); }
}

.modal-close {
  position: absolute; top: 14px; right: 14px;
  width: 34px; height: 34px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-2); cursor: pointer;
  transition: all 0.15s;
  z-index: 2;
}
.modal-close:hover { background: var(--border); color: var(--text); }
.modal-close svg { width: 17px; height: 17px; }

.modal-body { padding: 26px 26px 24px; }

.modal-tagrow {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.modal h2 {
  font-size: 1.4rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.22;
  color: var(--text);
  padding-right: 30px;
}
.modal-org {
  margin-top: 6px;
  font-size: 0.94rem;
  font-weight: 600;
  color: var(--brand);
}

.modal-facts {
  margin: 20px 0;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  overflow: hidden;
}
.modal-fact {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 13px 15px;
}
.modal-fact + .modal-fact { border-top: 1px solid var(--border-2); }
.modal-fact svg { width: 17px; height: 17px; color: var(--brand); flex-shrink: 0; margin-top: 1px; }
.modal-fact .fact-grow { flex: 1; min-width: 0; }
.modal-fact .fact-label {
  font-size: 0.72rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--text-3);
}
.modal-fact .fact-value {
  font-size: 0.94rem; font-weight: 500;
  color: var(--text); margin-top: 2px;
}
.fact-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--brand);
  text-decoration: none;
}
.fact-link svg { width: 14px !important; height: 14px !important; margin-top: 0 !important; }
.fact-link:hover { text-decoration: underline; text-underline-offset: 2px; }
.fact-area {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 7px;
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--text-2);
  background: var(--surface-2);
  border-radius: 999px;
  vertical-align: middle;
}

.modal-desc {
  font-size: 0.96rem;
  line-height: 1.6;
  color: var(--text-2);
  margin-bottom: 22px;
}

.modal-actions {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: var(--sans);
  font-size: 0.96rem; font-weight: 700;
  color: #fff;
  background: var(--brand);
  border: none;
  padding: 13px 20px;
  border-radius: var(--r-sm);
  cursor: pointer;
  text-decoration: none;
  transition: background 0.15s, transform 0.1s;
}
.btn-primary:hover { background: var(--brand-dark); }
.btn-primary:active { transform: translateY(1px); }
.btn-primary:focus-visible { outline: 2px solid var(--brand-dark); outline-offset: 2px; }
.btn-primary svg { width: 17px; height: 17px; }

/* Row of three compact secondary buttons under the primary action */
.btn-row { display: flex; gap: 8px; }
.btn-row .btn-secondary {
  flex: 1;
  padding: 10px 8px;
  font-size: 0.85rem;
  gap: 6px;
  text-decoration: none;
}
.btn-row .btn-secondary svg { width: 15px; height: 15px; }

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: var(--sans);
  font-size: 0.94rem; font-weight: 600;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 12px 20px;
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-secondary:hover { background: var(--surface-2); border-color: #d8d7d1; }
.btn-secondary:active { transform: translateY(1px); }
.btn-secondary:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.btn-secondary svg { width: 16px; height: 16px; color: var(--text-2); }

.modal-hint {
  margin-top: 14px;
  font-size: 0.8rem;
  line-height: 1.5;
  color: var(--text-3);
  text-align: center;
}

/* ============================================================
   About + Footer
   ============================================================ */
.site-footer {
  margin-top: 48px;
  background: var(--pine);
}
.footer-inner {
  max-width: 780px; margin: 0 auto;
  padding: 44px 24px 48px;
}

.about { margin-bottom: 30px; }
.about h2 {
  font-family: var(--display);
  font-size: 1.25rem;
  font-weight: 600;
  color: #fff;
  margin-bottom: 12px;
}
.about p {
  font-size: 0.94rem;
  line-height: 1.7;
  color: rgba(255, 255, 255, 0.72);
  max-width: 62ch;
}
.about p + p { margin-top: 12px; }
.about-disclaimer { color: rgba(255, 255, 255, 0.48) !important; font-size: 0.88rem; }

.footer-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding-top: 22px;
  border-top: 1px solid rgba(255, 255, 255, 0.14);
}
.footer-suggest { font-size: 0.94rem; color: rgba(255, 255, 255, 0.78); }
.footer-suggest a {
  color: var(--mist); font-weight: 600;
  text-decoration: underline; text-underline-offset: 2px;
}
.footer-suggest a:hover { color: #fff; }

.footer-updated {
  display: flex;
  gap: 14px;
  font-size: 0.8rem;
  color: rgba(255, 255, 255, 0.45);
}
.footer-updated .dot-sep { position: relative; }
.footer-updated .dot-sep + .dot-sep::before {
  content: "•";
  position: absolute;
  left: -9px;
  color: rgba(255, 255, 255, 0.25);
}

/* ============================================================
   Animations
   ============================================================ */
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes sheet { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.event-card, .calendar { animation: rise 0.34s ease both; }

/* ============================================================
   Mobile
   ============================================================ */
@media (max-width: 560px) {
  .site-header .container { padding-top: 30px; padding-bottom: 150px; }
  .hero-art { height: 140px; }
  .hero-stats { gap: 24px; }
  .stat-num { font-size: 1.4rem; }
  .container { padding: 0 18px; }

  .filter-row { flex-direction: column; align-items: stretch; gap: 10px; }
  .view-switch { align-self: flex-start; }
  .view-switch button { flex: 1; justify-content: center; }
  .view-switch .switch-label { display: inline; }

  .event-card { grid-template-columns: 48px 1fr; gap: 14px; padding: 16px 16px; }
  .date-chip .day { font-size: 1.6rem; }
  .card-head { flex-direction: column-reverse; align-items: flex-start; gap: 8px; }

  .calendar { padding: 14px; }
  .cal-grid, .cal-weekdays { gap: 4px; }
  .cal-cell { min-height: 52px; padding: 4px; }
  .cal-weekday { font-size: 0.6rem; }
  .cal-events-wrap { flex-direction: row; flex-wrap: wrap; gap: 3px; }
  .cal-event { width: 9px; height: 9px; font-size: 0; padding: 0; border-radius: 50%; }
}

/* ============================================================
   Loading / error status (before events arrive)
   ============================================================ */
.app-status {
  min-height: 60vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
  padding: 40px 24px;
  color: var(--text-2);
  font-family: var(--sans);
}
.app-status strong { font-size: 1.1rem; color: var(--text); }
.app-status svg { width: 32px; height: 32px; color: var(--text-3); }
.spinner {
  width: 26px; height: 26px;
  border: 3px solid var(--border);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================
   Skip link (visible only when focused)
   ============================================================ */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 12px;
  z-index: 200;
  padding: 10px 16px;
  background: var(--brand);
  color: #fff;
  font-family: var(--sans);
  font-weight: 600;
  border-radius: var(--r-sm);
  text-decoration: none;
}
.skip-link:focus { left: 12px; }

/* ============================================================
   "More filters" panel
   ============================================================ */
.more-row { margin-top: 10px; }
.more-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--sans);
  font-size: 0.82rem;
  font-weight: 600;
  padding: 6px 12px;
  color: var(--text-2);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.15s;
}
.more-toggle:hover { color: var(--text); border-color: #cfceC8; }
.more-toggle:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.more-toggle svg { width: 14px; height: 14px; transition: transform 0.18s; }
.more-toggle.open svg { transform: rotate(180deg); }
.more-count {
  min-width: 18px; height: 18px;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 5px;
  font-size: 0.7rem; font-weight: 700;
  color: #fff;
  background: var(--brand);
  border-radius: 999px;
}
.more-panel {
  margin-top: 10px;
  padding: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
}
.more-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
}
.more-group + .more-group { margin-top: 10px; }
.more-label {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-3);
  margin-right: 3px;
}
.flag-btn {
  font-family: var(--sans);
  font-size: 0.82rem;
  font-weight: 600;
  padding: 6px 13px;
  color: var(--text-2);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.15s;
}
.flag-btn:hover { border-color: #cfceC8; color: var(--text); }
.flag-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.flag-btn.active { color: #fff; background: var(--brand); border-color: var(--brand); }
.more-note {
  margin-top: 12px;
  font-size: 0.78rem;
  line-height: 1.5;
  color: var(--text-3);
}

/* ============================================================
   Free chip on cards + feature badges in the modal
   ============================================================ */
.free-chip {
  display: inline-flex;
  align-items: center;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 2px 9px;
  color: var(--t-tree-fg);
  background: var(--t-tree-bg);
  border-radius: 999px;
}
.feature-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}
.fbadge {
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 700;
  padding: 3px 10px;
  color: var(--t-tree-fg);
  background: var(--t-tree-bg);
  border-radius: 999px;
}
.fbadge.quiet { color: var(--text-2); background: var(--surface-2); }

/* ============================================================
   Trust box in the event modal
   ============================================================ */
.trust-box {
  margin-bottom: 20px;
  padding: 12px 14px;
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: var(--r-sm);
}
.trust-row {
  display: flex;
  gap: 10px;
  font-size: 0.84rem;
  line-height: 1.5;
}
.trust-row + .trust-row { margin-top: 6px; }
.trust-label {
  flex-shrink: 0;
  width: 84px;
  font-weight: 700;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-3);
  padding-top: 2px;
}
.trust-value { color: var(--text-2); }
.trust-value a {
  color: var(--brand);
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.fact-soft { color: var(--text-3); font-weight: 400; }

/* ============================================================
   Submit-an-event form
   ============================================================ */
.form-intro {
  margin: 10px 0 18px;
  font-size: 0.92rem;
  line-height: 1.6;
  color: var(--text-2);
}
.form-grid { display: flex; flex-direction: column; gap: 13px; }
.form-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-field { display: flex; flex-direction: column; gap: 5px; }
.form-field > span {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text-2);
}
.form-field input,
.form-field select,
.form-field textarea {
  font-family: var(--sans);
  font-size: 0.92rem;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.form-field input:focus,
.form-field select:focus,
.form-field textarea:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 4px var(--brand-ring);
}
.form-field textarea { resize: vertical; }
.form-error {
  font-style: normal;
  font-size: 0.78rem;
  font-weight: 600;
  color: #b3372c;
}
.submission-json {
  max-height: 260px;
  overflow: auto;
  margin: 0 0 16px;
  padding: 13px 14px;
  font-size: 0.76rem;
  line-height: 1.5;
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: var(--r-sm);
  white-space: pre-wrap;
  word-break: break-word;
}
.form-grid { margin-bottom: 18px; }

/* Footer link-styled buttons */
.footer-link-btn {
  font-family: var(--sans);
  font-size: inherit;
  font-weight: 600;
  color: var(--mist);
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.footer-link-btn:hover { color: #fff; }
.footer-dot { margin: 0 8px; color: rgba(255, 255, 255, 0.35); }

@media (max-width: 560px) {
  .form-pair { grid-template-columns: 1fr; }
  .trust-row { flex-direction: column; gap: 1px; }
  .trust-label { width: auto; }
}

/* ============================================================
   Quick-filter count badges
   ============================================================ */
.quick-btn .quick-n {
  min-width: 19px;
  height: 19px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 5px;
  margin-left: 2px;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--brand);
  background: #fff;
  border: 1px solid #d3e4da;
  border-radius: 999px;
}
.quick-btn.active .quick-n {
  color: #fff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.35);
}

/* ============================================================
   Blocked-link fallback (sandboxed viewers that block pop-ups)
   ============================================================ */
.link-fallback {
  margin-top: 14px;
  padding: 12px 14px;
  font-size: 0.85rem;
  line-height: 1.55;
  color: var(--text-2);
  background: var(--brand-tint);
  border: 1px solid #d3e4da;
  border-radius: var(--r-sm);
}
.link-fallback strong { color: var(--text); }
.link-fallback-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 9px;
}
.link-fallback-row code {
  flex: 1;
  min-width: 0;
  padding: 8px 10px;
  font-size: 0.76rem;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  overflow-wrap: anywhere;
  user-select: all;
}
.link-fallback-row .btn-secondary {
  flex-shrink: 0;
  padding: 8px 13px;
  font-size: 0.82rem;
}

/* Satellite toggle button on the map */
.map-sat-toggle {
  font-family: var(--sans);
  font-size: 0.8rem;
  font-weight: 700;
  padding: 7px 13px;
  color: var(--text);
  background: #fff;
  border: 2px solid rgba(0, 0, 0, 0.2);
  border-radius: 6px;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
  transition: background 0.14s;
}
.map-sat-toggle:hover:not(:disabled) { background: var(--surface-2); }
.map-sat-toggle:disabled { color: var(--text-3); cursor: not-allowed; }

/* ============================================================
   Print stylesheet — printing the page produces a clean event
   flyer: header + the event list, no interactive chrome.
   ============================================================ */
@media print {
  .skip-link, .toolbar, .next-up, .hero-art, .hero-stats,
  .map-wrap, .map-legend, .modal-overlay, .footer-bar,
  .empty-reset, .card-cta {
    display: none !important;
  }
  body { background: #fff; }
  .site-header {
    background: #fff;
    padding: 0;
  }
  .site-header .container { padding: 0 0 12px; }
  .site-header h1 { color: #000; font-size: 1.7rem; }
  .hero-accent { color: #333; }
  .site-header p { color: #333; }
  .brand-name { color: #000; }
  .brand-mark { background: #0d3b26; }
  .brand-mark svg { color: #fff; }
  .event-card {
    break-inside: avoid;
    box-shadow: none;
    border-color: #ccc;
  }
  .site-footer { background: #fff; }
  .about h2 { color: #000; }
  .about p, .about-disclaimer { color: #333 !important; }
}

</style>

const MONTHS_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function dateFromISO(isoDate) {

  const d = dateFromISO(isoDate);

    weekday: "long",
    month: "long",
    day: "numeric",
    year: "numeric"

    month: "long",
    day: "numeric",
    year: "numeric"

function daysUntil(isoDate) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const then = dateFromISO(isoDate);
  return Math.round((then - today) / 86400000);
}

// A short, human "when" label relative to today: "Today", "Tomorrow",
// "This weekend", "In 4 days", "Next week", "In 3 weeks", etc.
// Returns { label, urgent } — urgent=true for anything within a week,
// so the badge can be styled to stand out.
function relativeWhen(isoDate) {

  };
  if (d === 0) return {
    label: "Today",
    urgent: true
  };
  if (d === 1) return {
    label: "Tomorrow",
    urgent: true
  };

  // we reuse the same window logic as the quick filter so the badge and
  // the filter can never disagree. (Without this, a Sunday viewing an
  // event the FOLLOWING Saturday would mislabel it "This weekend".)

    label: "This weekend",

  if (d <= 13) return {
    label: "Next week",
    urgent: false
  };
  if (d <= 27) return {
    label: `In ${Math.round(d / 7)} weeks`,
    urgent: false
  };

function monthKey(isoDate) {

   ------------------------------------------------------------
